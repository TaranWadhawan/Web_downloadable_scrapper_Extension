<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            width: 320px;
            margin: 10px;
        }

        h3 {
            margin-top: 0;
        }

        button {
            width: 100%;
            padding: 8px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        #results {
            margin-top: 10px;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 5px;
            font-size: 12px;
        }

        .media-item {
            padding: 5px;
            border-bottom: 1px solid #eee;
            word-break: break-all;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .media-item a {
            text-decoration: none;
            color: #007bff;
            margin-right: 5px;
        }

        .download-btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 2px 6px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 10px;
        }

        .download-btn:hover {
            background-color: #218838;
        }
    </style>
</head>

<body>
    <h3>Media Finder</h3>
    <button id="scanBtn">Scan Page for Media</button>
    <div id="results">No media detected yet. Click Scan.</div>

    <script src="popup.js"></script>
</body>

</html>
